# dsh-desktop-chat bundle patch: inserts the dual-face plugin row into a profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; activate by adding this package to the profile's
# `dsh.profile.bundles`, or with
#   dsh plugin --profile desktop add @jamolpe88/dsh-desktop-chat
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the Host process and registers the /api/dsh-desktop-chat routes, and the
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client", served at /plugins/<id>/client.js) load in the Web GUI as the
# sidebar entry and its panel. `name` must be this package's manifest name
# verbatim (scoped names included) — dsh-client-modules keys every browser row by
# it, and lib/client.js registers its factory under the same id. `id` is the
# profile entry id; keep it stable, it is unique per profile.
- insert:
    - id: desktop-chat
      name: '@jamolpe88/dsh-desktop-chat'
